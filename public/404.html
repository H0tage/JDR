<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirection…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var path = window.location.pathname;

        // GitHub Pages returns this document for client-side routes. Assets must
        // remain a normal 404: redirecting an old JavaScript chunk would turn it
        // into HTML and make an already-open page fail more confusingly.
        if (path.indexOf('/assets/') === 0) return;

        var route = path + window.location.search + window.location.hash;
        window.location.replace('/?route=' + encodeURIComponent(route));
      }());
    </script>
  </head>
  <body></body>
</html>
